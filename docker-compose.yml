services:
  postgres:
    image: postgres:16-alpine
    container_name: imeditate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imeditate
      POSTGRES_PASSWORD: imeditate_dev_only # dev only; override in production
      POSTGRES_DB: imeditate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imeditate -d imeditate"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: imeditate-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgres://imeditate:imeditate_dev_only@postgres:5432/imeditate
      PORT: "3000"
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media

  app:
    image: node:22-alpine
    container_name: imeditate-app
    working_dir: /app
    user: "501:20"
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      HOME: /tmp
      EXPO_NO_TELEMETRY: "1"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PUBLIC_API_URL: http://192.168.34.214:3000
    volumes:
      - ./app:/app
      - app_modules:/app/node_modules
      - app_expo:/app/.expo
    ports:
      - "8081:8081"
    command: sh -c "npx expo start --tunnel"
    profiles: ["app"]

volumes:
  pgdata:
  media:
  app_modules:
  app_expo:
