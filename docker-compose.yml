services:
  postgres:
    image: postgres:16-alpine
    container_name: imeditate-postgres
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imeditate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
      POSTGRES_DB: ${POSTGRES_DB:-imeditate}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imeditate -d imeditate"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: imeditate-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-imeditate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-imeditate}
      PORT: "3000"
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media

  app:
    image: node:22-alpine
    container_name: imeditate-app
    working_dir: /app
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      HOME: /tmp
      EXPO_NO_TELEMETRY: "1"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: 192.168.34.214
      EXPO_PUBLIC_API_URL: http://192.168.34.214:3000
    volumes:
      - ./app:/app
      - app_modules:/app/node_modules
      - app_expo:/app/.expo
    ports:
      - "8081:8081"
    command: sh -c "npm install --no-audit --no-fund --package-lock=false && npm install -g @expo/ngrok@^4.1.0 && npx expo start --lan --non-interactive"
    profiles: ["app"]

volumes:
  pgdata:
  media:
  app_modules:
  app_expo:
